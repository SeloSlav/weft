<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weft validation</title>
<style>body{margin:0;background:#121b22;color:#e9efdf;font:14px system-ui}main{max-width:1100px;margin:auto;padding:22px}button,select{padding:9px;margin:3px;background:#273b3c;color:inherit;border:1px solid #668477;border-radius:5px}canvas{width:100%;display:block;border-radius:12px}pre{white-space:pre-wrap;line-height:1.6}.pass{color:#9ae6ac}.fail{color:#ffa3a3}</style></head>
<body><main><h1>Weft · reproducible validation</h1><p>Three.js r183 · WebGPU · 960 × 540 · DPR 1 · no post-processing</p>
<div id="controls"><label>Landscape <select id="preset"><option value="woodland">Fern glade</option><option value="meadow">Open meadow</option><option value="autumn">Amber woodland</option></select></label><button id="pause">Play wind</button><button id="reset">Reset</button><button id="damage">Disturb & burn</button><label>View <select id="camera"><option value="design">Design</option><option value="near">Near</option><option value="far">Far</option></select></label><label>Diagnostic <select id="debug"><option value="final">Final / no post</option><option value="wireframe">Wireframe</option><option value="color">Vertex colors</option></select></label><button id="tests">Run checks & benchmark</button></div>
<label>Field seed <select id="seed"><option>17</option><option>71</option><option>1337</option></select></label>
<canvas id="scene" width="960" height="540"></canvas><pre id="metrics"></pre><pre id="results">Ready.</pre></main><script type="module" src="./validation.ts"></script></body></html>
